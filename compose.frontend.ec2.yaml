services:
  frontend:
    image: ghcr.io/kb-kkobi/frontend:latest
    container_name: kkobi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/kkobi/certbot/www:/var/www/certbot:ro
      - /opt/kkobi/certbot/conf:/etc/letsencrypt:ro
      - /opt/kkobi/nginx/event.conf:/etc/nginx/conf.d/event.conf:ro