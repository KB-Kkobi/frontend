name: Frontend CI/CD

"on":
  push:
    branches:
      - develop
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kb-kkobi/frontend

jobs:
  build-and-push:
    name: Build and push frontend image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # GitHub Actions 실행 환경에 프론트엔드 코드를 내려받는다.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Docker 이미지를 빌드할 Buildx 환경을 준비한다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GitHub가 제공하는 토큰으로 GHCR에 로그인한다.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 프론트엔드 Docker 이미지를 생성하고 GHCR에 업로드한다.
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy frontend to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    # 배포 활성화 변수가 true인 경우에만 EC2 배포를 실행한다.
    if: vars.ENABLE_EC2_DEPLOY == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      # EC2에 전달할 Compose 파일을 내려받는다.
      - name: Checkout repository
        uses: actions/checkout@v7

      # GitHub OIDC 토큰으로 AWS IAM 역할을 임시로 맡는다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # AWS SSM을 통해 EC2 내부에서 프론트엔드를 배포한다.
      - name: Deploy frontend through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          # 프론트엔드 Compose 파일을 한 줄 문자열로 변환한다.
          COMPOSE_BASE64="$(base64 -w 0 compose.frontend.ec2.yaml)"

          # EC2 내부에서 실행할 명령 목록을 만든다.
          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -eu",
              "printf '%s' '$COMPOSE_BASE64' | base64 -d > /opt/kkobi/compose.frontend.ec2.yaml",
              "cd /opt/kkobi",
              "mkdir -p /opt/kkobi/certbot/www",
              "test -f /opt/kkobi/certbot/conf/live/kkobi.site/fullchain.pem",
              "test -f /opt/kkobi/certbot/conf/live/kkobi.site/privkey.pem",
              "docker compose -f compose.ec2.yaml -f compose.frontend.ec2.yaml pull frontend",
              "docker compose -f compose.ec2.yaml -f compose.frontend.ec2.yaml up -d --no-deps frontend",
             "if curl -fsS --retry 30 --retry-delay 5 --retry-all-errors --retry-connrefused --retry-max-time 180 --connect-timeout 5 --max-time 10 --resolve kkobi.site:443:127.0.0.1 https://kkobi.site/ > /dev/null && curl -fsS --retry 30 --retry-delay 5 --retry-all-errors --retry-connrefused --retry-max-time 180 --connect-timeout 5 --max-time 10 --resolve kkobi.site:443:127.0.0.1 https://kkobi.site/api/health; then echo; echo 'Frontend HTTPS health check passed.'; else echo 'Frontend HTTPS health check failed.'; docker compose -f compose.ec2.yaml -f compose.frontend.ec2.yaml logs --tail=100 frontend; exit 1; fi"
            ]
          }
          EOF

          # 꼬비 EC2에 SSM 명령을 전달하고 명령 ID를 받는다.
          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Kkobi frontend ${GITHUB_SHA}" \
              --parameters file://ssm-parameters.json \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command ID: $COMMAND_ID"

          # EC2 배포 명령이 끝날 때까지 상태를 반복 확인한다.
          for attempt in $(seq 1 60); do
            STATUS="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            echo "SSM command status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{
                    Status: Status,
                    Output: StandardOutputContent,
                    Error: StandardErrorContent
                  }" \
                  --output json

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{
                    Status: Status,
                    Output: StandardOutputContent,
                    Error: StandardErrorContent
                  }" \
                  --output json

                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac
          done

          echo "SSM command result timed out."

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json || true

          exit 1
